<!doctype html>
<html lang="en" data-cluster="staging">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eddy: Flux explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@property --c{syntax:'<color>';inherits:true;initial-value:#6D28D9}
@property --c2{syntax:'<color>';inherits:true;initial-value:#DB2777}
:root{
  --frame:#E7EAF0;--win:#FFFFFF;--side:#F8F9FB;--s2:#F3F5F8;--ink:#101217;--ink-2:#414856;--ink-3:#5C6473;--line:#E5E8EE;--line-2:#D2D6DE;
  --ok:#15803D;--bad:#C81E4B;--run:#1D4ED8;--off:#5C6473;
  --pe:#C2410C;--pe2:#F59E0B;--st:#6D28D9;--st2:#DB2777;--dv:#0F766E;--dv2:#2563EB;--c-ink:#FFFFFF;
  --log-bg:#14161B;--log-ink:#D9DDE5;--log-dim:#8A92A1;
  --glow:.55;--shadow:0 1px 2px rgba(16,18,23,.05),0 24px 60px -28px rgba(16,18,23,.35);
  --ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --c:var(--st);--c2:var(--st2);
  --c-soft:color-mix(in oklab,var(--c) 10%,var(--win));
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;transition:--c .7s ease,--c2 .7s ease;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --frame:#0B0D11;--win:#14171C;--side:#111419;--s2:#1B1F26;--ink:#ECEEF2;--ink-2:#B9BFCB;--ink-3:#969EAC;--line:#252A32;--line-2:#363C47;
  --ok:#4ADE80;--bad:#FB7185;--run:#7AA2FF;--off:#9CA3AF;
  --pe:#FB923C;--pe2:#F59E0B;--st:#A78BFA;--st2:#EC4899;--dv:#2DD4BF;--dv2:#3B82F6;--c-ink:#14161B;
  --log-bg:#0A0C10;--glow:.3;--shadow:0 24px 60px -24px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --frame:#0B0D11;--win:#14171C;--side:#111419;--s2:#1B1F26;--ink:#ECEEF2;--ink-2:#B9BFCB;--ink-3:#969EAC;--line:#252A32;--line-2:#363C47;
  --ok:#4ADE80;--bad:#FB7185;--run:#7AA2FF;--off:#9CA3AF;
  --pe:#FB923C;--pe2:#F59E0B;--st:#A78BFA;--st2:#EC4899;--dv:#2DD4BF;--dv2:#3B82F6;--c-ink:#14161B;
  --log-bg:#0A0C10;--glow:.3;--shadow:0 24px 60px -24px rgba(0,0,0,.7);color-scheme:dark}
:root[data-cluster="prod-eu"]{--c:var(--pe);--c2:var(--pe2)}
:root[data-cluster="staging"]{--c:var(--st);--c2:var(--st2)}
:root[data-cluster="dev"]{--c:var(--dv);--c2:var(--dv2)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
  background:
   radial-gradient(1100px 720px at -5% -10%,color-mix(in oklab,var(--c) calc(var(--glow)*100%),transparent),transparent 62%),
   radial-gradient(900px 640px at 105% 110%,color-mix(in oklab,var(--c2) calc(var(--glow)*90%),transparent),transparent 60%),
   radial-gradient(700px 520px at 100% -10%,color-mix(in oklab,var(--c2) calc(var(--glow)*45%),transparent),transparent 60%),
   var(--frame)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--c);outline-offset:2px;border-radius:8px}
kbd{font-family:var(--mono);font-size:10.5px;line-height:1;padding:3px 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:var(--win);color:var(--ink-3);white-space:nowrap}
.i{width:16px;height:16px;flex:none}
.mono{font-family:var(--mono)}

.frame{height:100%;padding:16px}
.win{height:100%;display:flex;flex-direction:column;background:var(--win);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;border:1px solid color-mix(in oklab,var(--c) 22%,var(--line))}
.ribbon{height:3px;flex:none;background:var(--c)}
:root[data-protected="true"] .ribbon{height:5px;background:repeating-linear-gradient(-45deg,var(--c) 0 9px,#1C1E23 9px 18px)}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:252px minmax(0,1fr) 420px}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:14px 12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:650;font-size:17px;letter-spacing:-.02em;padding:4px 8px 14px}
.logo svg{width:22px;height:22px;color:var(--c)}
.switch{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:0 11px;align-items:center;width:100%;padding:9px 10px 9px 9px;border-radius:14px;background:var(--win);border:1px solid var(--line);text-align:left;box-shadow:0 1px 2px rgba(16,18,23,.04)}
.switch:hover{border-color:color-mix(in oklab,var(--c) 45%,var(--line))}
.sw{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--c),var(--c2));color:var(--c-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;grid-row:1/span 2}
:root[data-protected="true"] .switch .sw,.clrow.protected .sw{background:repeating-linear-gradient(-45deg,var(--cc,var(--c)) 0 6px,#1C1E23 6px 12px)}
.switch .sn{font-weight:650;font-size:15px;display:flex;align-items:center;gap:6px;min-width:0}
.switch .sn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch .se{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch .sc{grid-row:1/span 2;grid-column:3;color:var(--ink-3)}
.lockb{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:650;color:var(--c);padding:2px 6px;border-radius:6px;background:color-mix(in oklab,var(--c) 12%,transparent)}
.lockb .i{width:11px;height:11px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:18px}
.nav h3{font-size:12px;font-weight:550;color:var(--ink-3);margin:0 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:10px;color:var(--ink-2);font-size:13.5px;text-align:left}
.nav button:hover{background:var(--s2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--c-soft);color:var(--ink);font-weight:560}
.nav button[aria-current="true"] .i{color:var(--c)}
.nav .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav .n.bad{color:var(--bad);font-weight:650}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 4px 2px;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:13px;flex:none}
.me .mt{display:flex;flex-direction:column;min-width:0;font-size:12.5px}
.me .mt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .mt span{color:var(--ink-3)}
.me .ib{margin-left:auto}
.ib{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);flex:none}
.ib:hover{background:var(--s2);color:var(--ink)}
.seg{display:flex;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--win)}
.seg button{flex:1;height:30px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-size:12.5px;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--win)}
.seg button[aria-pressed="true"] kbd{background:transparent;color:inherit;border-color:color-mix(in oklab,var(--win) 40%,transparent)}

/* content */
.content{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;height:62px;padding:0 20px;border-bottom:1px solid var(--line);flex:none}
.top .switch{display:none;width:auto;max-width:230px;padding:5px 9px 5px 5px;grid-template-columns:30px minmax(0,1fr) auto;gap:0 8px}
.top .switch .sw{width:30px;height:30px;border-radius:9px;font-size:13px}
.top .switch .se{display:none}
.top .switch .sn{font-size:14px}
.crumbs{display:flex;align-items:center;gap:2px;font-size:15px;color:var(--ink-3);overflow-x:auto;white-space:nowrap;scrollbar-width:none;min-width:0;flex:1}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{padding:5px 7px;border-radius:8px}
.crumbs button:hover{background:var(--s2);color:var(--ink)}
.crumbs .sep{width:13px;height:13px;opacity:.55}
.crumbs .cur{color:var(--ink);font-weight:600;padding:5px 7px;display:inline-flex;align-items:center;gap:8px}
.crumbs .cur.mono,.crumbs button.mono{font-size:14px}
.search{display:flex;align-items:center;gap:9px;height:38px;width:min(340px,32vw);padding:0 8px 0 12px;border:1px solid var(--line);border-radius:11px;background:var(--s2);color:var(--ink-3);text-align:left;flex:none}
.search:hover{border-color:var(--line-2)}
.search .t{flex:1;font-size:13.5px}
.aibtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:11px;font-weight:580;font-size:13.5px;color:var(--ink);border:1px solid color-mix(in oklab,var(--c) 35%,var(--line));background:linear-gradient(135deg,color-mix(in oklab,var(--c) 12%,var(--win)),color-mix(in oklab,var(--c2) 12%,var(--win)));flex:none}
.aibtn .i{color:var(--c)}
.aibtn[aria-pressed="true"]{border-color:var(--c)}
.page{flex:1;min-height:0;overflow:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:16px}
.cur-strip{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--side);font-size:13px}
.cur-strip.failed{border-color:color-mix(in oklab,var(--bad) 40%,var(--line));background:color-mix(in oklab,var(--bad) 6%,var(--win))}
.cur-strip b{font-weight:600}
.cur-strip .cm{color:var(--ink-2)}
.cur-strip button{margin-left:auto}
.cards{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:14px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--win);display:flex;flex-direction:column;gap:10px;min-width:0}
.card h4{margin:0;font-size:14.5px;font-weight:620;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h4 .big{margin-left:auto;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.02em}
.card h4 .big.bad{color:var(--bad)}
.card .sub{font-size:12.5px;color:var(--ink-3);margin-top:-6px}
.citem{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;text-align:left;width:100%;min-width:0;font-size:12.5px}
.citem:hover{background:var(--s2)}
.citem .nm{font-family:var(--mono);font-weight:500;white-space:nowrap}
.citem .ms{color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .kv2{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.card .kv2 dt{color:var(--ink-3)}.card .kv2 dd{margin:0;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .row-btns{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.card.ai{border-color:color-mix(in oklab,var(--c) 30%,var(--line));background:
  radial-gradient(120% 140% at 0% 0%,color-mix(in oklab,var(--c) 22%,transparent),transparent 60%),
  radial-gradient(120% 140% at 100% 100%,color-mix(in oklab,var(--c2) 22%,transparent),transparent 60%),var(--win)}
.card.ai p{margin:-4px 0 0;font-size:12.5px;color:var(--ink-2)}
.qchip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);background:color-mix(in oklab,var(--win) 80%,transparent);font-size:12.5px;text-align:left;line-height:1.3}
.qchip:hover{border-color:var(--c)}
.qchip .i{width:13px;height:13px;color:var(--c)}

.tools{display:flex;gap:10px;align-items:center}
.filter{display:flex;align-items:center;gap:7px;height:36px;padding:0 8px 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--win);flex:0 1 300px;min-width:160px;color:var(--ink-3)}
.filter:focus-within{border-color:var(--c)}
.filter input{border:0;background:none;outline:none;font:inherit;font-size:14px;color:var(--ink);flex:1;min-width:0}
.chips{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;background:var(--win)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--win);border-color:var(--ink)}
.chip .n{opacity:.75;font-variant-numeric:tabular-nums}
.tools .cnt{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap}

.table{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--win)}
.thead,.row-main{display:grid;grid-template-columns:minmax(170px,1.2fr) 118px 118px minmax(0,2fr) 128px 48px 14px;gap:14px;align-items:center}
.thead{padding:9px 16px;font-size:12px;color:var(--ink-3);background:var(--side);border-bottom:1px solid var(--line)}
.rows{list-style:none;margin:0;padding:4px}
.row{display:flex;border-radius:11px}
.row-main{flex:1;min-width:0;padding:8px 12px;border-radius:11px;text-align:left;min-height:52px}
.row:hover .row-main{background:var(--s2)}
.row.sel .row-main{background:var(--c-soft);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 30%,transparent)}
.nmc{display:flex;flex-direction:column;min-width:0}
.name{font-family:var(--mono);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ns{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kd{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:560;white-space:nowrap}
.st{display:inline-flex;color:var(--off)}
.st-ready,.stp.ready{color:var(--ok)}.st-failed,.stp.failed{color:var(--bad)}.st-progressing,.stp.progressing{color:var(--run)}.st-suspended,.stp.suspended{color:var(--off)}
.msg{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.failed .msg{color:var(--bad)}
.rev{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.age{font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.chev{display:flex;color:var(--ink-3)}.chev .i{width:14px;height:14px}
.row.sel .chev{color:var(--c)}
.msg2{display:none}
.row-info{display:none}
.spin{animation:spin 1s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3)}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* detail */
.detail{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--side)}
.dtop{padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.dbody{flex:1;overflow:auto;padding:18px 20px 28px;min-height:0}
.dk{display:flex;gap:8px;align-items:center;color:var(--ink-3);font-size:12.5px}
.kind{font-family:var(--mono);font-size:10px;font-weight:600;padding:4px 6px;border-radius:6px;background:var(--win);border:1px solid var(--line);color:var(--ink-2)}
.dname{font-family:var(--mono);font-size:18px;font-weight:600;word-break:break-all;margin:8px 0 2px;line-height:1.3}
.dstatus{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--win);border:1px solid var(--line);margin:14px 0 12px;font-size:13px}
.dstatus .st{margin-top:1px}
.dstatus b{display:block;font-weight:620}
.dstatus.failed{border-color:color-mix(in oklab,var(--bad) 45%,var(--line));background:color-mix(in oklab,var(--bad) 6%,var(--win))}
.dstatus.progressing{border-color:color-mix(in oklab,var(--run) 40%,var(--line))}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--win);font-weight:560;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--c);border-color:var(--c);color:var(--c-ink)}
.btn.primary kbd{background:transparent;color:var(--c-ink);border-color:color-mix(in oklab,var(--c-ink) 45%,transparent)}
.btn.soft{border-color:color-mix(in oklab,var(--c) 40%,var(--line));background:linear-gradient(135deg,color-mix(in oklab,var(--c) 10%,var(--win)),color-mix(in oklab,var(--c2) 10%,var(--win)))}
.btn.soft .i{color:var(--c)}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}
.btn.locked{opacity:.5}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.note{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;margin:2px 0 16px}
.note .i{width:13px;height:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{padding:9px 10px;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--c);font-weight:600}
.hb{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.hb .i{width:13px;height:13px}
.hb.failed{color:var(--bad)}.hb.progressing{color:var(--run)}.hb.suspended{color:var(--off)}.hb.ready{color:var(--ok)}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:9px 16px;margin:0;font-size:13px}
dl.kv dt{color:var(--ink-3)}
dl.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-all}
.linkbtn{color:var(--c);font-family:var(--mono);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;text-align:left}
.evs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.ev{padding:10px 12px;border-radius:12px;background:var(--win);border:1px solid var(--line);font-size:12.5px}
.ev .eh{display:flex;justify-content:space-between;gap:8px;margin-bottom:2px}
.ev .r{font-weight:620}.ev.warn .r{color:var(--bad)}
.ev .a{color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev p{margin:0;color:var(--ink-2);word-break:break-word}
pre.yaml{font-family:var(--mono);font-size:12px;line-height:1.65;background:var(--win);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:auto;margin:0}
.yk{color:var(--c)}.ys{color:var(--ink-2)}

/* ai */
.ai{display:flex;flex-direction:column;min-height:0;flex:1}
.aictx{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-3);flex:none;flex-wrap:wrap}
.ctxchip{display:inline-flex;align-items:center;gap:7px;padding:4px 6px 4px 9px;border-radius:999px;background:var(--win);border:1px solid var(--line-2);color:var(--ink);font-family:var(--mono);font-size:12px;max-width:100%}

.ctxchip button{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3)}

.aictx .new{margin-left:auto}
.aimsgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.ahello{padding:16px;border-radius:16px;border:1px solid color-mix(in oklab,var(--c) 28%,var(--line));background:
  radial-gradient(120% 140% at 0% 0%,color-mix(in oklab,var(--c) 16%,transparent),transparent 60%),
  radial-gradient(120% 140% at 100% 100%,color-mix(in oklab,var(--c2) 16%,transparent),transparent 60%),var(--win)}
.ahello h4{margin:0 0 4px;font-size:15px;font-weight:620}

.comp{border-top:1px solid var(--line);padding:12px 14px 14px;flex:none;display:flex;flex-direction:column;gap:8px}
.cbox{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line-2);border-radius:14px;background:var(--win)}
.cbox:focus-within{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in oklab,var(--c) 15%,transparent)}
.cbox textarea{flex:1;border:0;outline:none;resize:none;background:none;font:inherit;font-size:14px;color:var(--ink);max-height:140px;min-height:24px;padding:6px 0;line-height:1.45}
.send{width:36px;height:36px;border-radius:10px;background:var(--c);color:var(--c-ink);display:inline-flex;align-items:center;justify-content:center;flex:none}

.fine{font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px}

/* logs */
.logs{flex:1;display:flex;flex-direction:column;background:var(--log-bg);color:var(--log-ink);min-height:0}

.lgh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}

.lg{display:grid;grid-template-columns:92px 44px 1fr;gap:12px;padding:1px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.6}

.lg.info .l{color:#8DB4FF}.lg.warn .l{color:#FBBF24}.lg.error .l{color:#FB7185}.lg.error .m{color:#FFC2CD}
.lg .m{white-space:pre-wrap;word-break:break-word}

.bnav{display:none;justify-content:space-around;border-top:1px solid var(--line);background:var(--win);padding:2px 6px;flex:none}

.bnav .badge{position:relative;display:inline-flex}
.bnav .badge[data-n]:after{content:attr(data-n);position:absolute;top:-6px;right:-10px;font-size:10px;font-weight:700;background:var(--bad);color:#fff;border-radius:999px;padding:1px 5px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.4);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding:max(10vh,calc(env(safe-area-inset-top,0px) + 16px)) 16px 16px}

.pres{overflow:auto;padding:6px}
.pg{font-size:12px;color:var(--ink-3);padding:10px 10px 4px;font-weight:550}
.pi{--cc:var(--c);display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:10px;text-align:left;min-height:46px}
.pi[aria-selected="true"]{background:var(--c-soft)}

.pi .ic.swi{background:linear-gradient(135deg,var(--cc),var(--cc2,var(--cc)))}
.pi .pl{flex:1;min-width:0;display:flex;flex-direction:column}
.pi .pt{font-weight:540;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .pt.mono{font-size:13px;font-weight:500}
.pi .ps{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctag{font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid color-mix(in oklab,var(--cc) 55%,var(--line));color:var(--ink);font-weight:560;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ctag:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cc)}
.pfoot{display:flex;gap:16px;padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.pfoot span{display:inline-flex;gap:6px;align-items:center}
.pnone{padding:28px 16px;text-align:center;color:var(--ink-3)}
.modal{padding:22px}
.modal h3{margin:0 0 6px;font-size:18px;letter-spacing:-.015em}
.modal p{margin:0 0 14px;color:var(--ink-2)}
.modal label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.modal input{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--s2);font-family:var(--mono);font-size:15px;color:var(--ink);outline:none}
.modal input:focus{border-color:var(--c)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 28px;padding:4px 22px 22px;overflow:auto}
.hgrid h4{grid-column:1/-1;margin:14px 0 4px;font-size:13px;color:var(--ink-3);font-weight:550}
.hk{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.hk span:last-child{display:flex;gap:4px}
#clm{justify-content:flex-start;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 118px) 16px 16px 28px;background:rgba(10,12,16,.18)}
#clm .dialog{width:min(340px,100%);padding:8px}
.clrow{--cc:var(--c);display:grid;grid-template-columns:38px 1fr auto;gap:0 11px;align-items:center;padding:9px 10px;border-radius:12px;text-align:left;width:100%;min-height:58px}
.clrow:hover,.clrow[aria-current="true"]{background:var(--s2)}
.clrow .sw{background:linear-gradient(135deg,var(--cc),var(--cc2))}
.clrow .cn{font-weight:620;display:flex;align-items:center;gap:6px}.clrow .cm{font-size:12px;color:var(--ink-3);grid-column:2}
.clrow .ch{grid-column:3;grid-row:1/span 2;display:flex;gap:6px;align-items:center}
.clsec{border-top:1px solid var(--line);margin-top:6px;padding:12px 8px 6px;display:none;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2)}
#sheet{align-items:flex-end;padding:0}
.sheetbody{width:100%;height:88vh;display:flex;flex-direction:column;background:var(--side);border-radius:22px 22px 0 0;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 2px;flex:none}
#toasts{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:9px;max-width:380px;padding:11px 14px;border-radius:13px;background:var(--ink);color:var(--win);font-size:13px;box-shadow:0 14px 34px -12px rgba(0,0,0,.4);animation:tin .22s ease-out}
.toast .i{margin-top:1px}.toast.ok .i{color:#4ADE80}.toast.bad .i{color:#FB7185}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

@media (max-width:1439px){.thead,.row-main{grid-template-columns:minmax(160px,1.2fr) 110px 112px minmax(0,2fr) 46px 14px}.c-rev{display:none}}
@media (max-width:1180px){
  .shell{grid-template-columns:minmax(0,1fr) 380px}
  .side{display:none}
  .top .switch{display:grid}
  .chips{display:flex}
  .clsec{display:flex}
  #clm{padding-left:16px;padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
  .cards{grid-template-columns:1fr 1fr}.card.ai{grid-column:1/-1}
  .thead,.row-main{grid-template-columns:minmax(150px,1.2fr) 112px minmax(0,1.6fr) 46px 14px}.c-kind{display:none}
}
@media (max-width:859px){
  .frame{padding:0}
  .win{border-radius:0;border:0}
  .shell{grid-template-columns:minmax(0,1fr)}
  .detail{display:none}
  .bnav{display:flex}
  .top{height:58px;padding:0 10px;gap:8px}
  .top .switch{flex:1;max-width:none}
  .crumbs{display:none}
  .search{width:40px;padding:0;justify-content:center}.search .t,.search kbd{display:none}
  .aibtn{display:none}
  .page{padding:12px 12px 20px;gap:12px}
  .mcrumbs{display:flex!important}
  .cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -12px;padding:0 12px;scrollbar-width:none}
  .cards::-webkit-scrollbar{display:none}
  .card{flex:0 0 82%;scroll-snap-align:start}
  .tools{flex-direction:column;align-items:stretch;gap:8px}
  .filter{flex:none}
  .tools .cnt{display:none}
  .thead{display:none}
  .table{border-radius:14px}
  .row-main{grid-template-columns:18px minmax(0,1fr) 14px;gap:10px;padding:8px 6px 8px 10px;min-height:58px}
  .row-main>.c-kind,.row-main>.c-msg,.row-main>.c-age,.row-main>.c-rev{display:none}
  .row-main .c-st .lbl{display:none}
  .row-main .c-st{order:-1}
  .msg2{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
  .row.failed .msg2{color:var(--bad)}
  .row-info{display:flex;align-items:center;justify-content:center;width:44px;flex:none;color:var(--ink-3);border-radius:10px}
  .lg{grid-template-columns:1fr;gap:0;padding:4px 14px}.lg .meta{display:flex;gap:8px}
  #toasts{left:12px;right:12px;align-items:stretch;bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
  .toast{max-width:none}
  #clm{align-items:flex-end;padding:0;background:rgba(10,12,16,.4)}
  #clm .dialog{width:100%;border-radius:22px 22px 0 0;padding:8px 10px calc(20px + env(safe-area-inset-bottom,0px));max-height:86vh}
  .scrim.top{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
}
.mcrumbs{display:none;align-items:center;gap:2px;font-size:13px;color:var(--ink-3);overflow-x:auto;white-space:nowrap;scrollbar-width:none;margin:-2px 0 -4px}
.mcrumbs button{padding:4px 6px;border-radius:7px}.mcrumbs .cur{color:var(--ink);font-weight:600;padding:4px 6px}.mcrumbs .sep{width:12px;height:12px;opacity:.55}
@media (prefers-reduced-motion:reduce){:root{transition:none}.spin{animation-duration:3s}}

<body>
<div class="frame"><div class="win">
  <div class="ribbon"></div>
  <div class="shell">
    <aside class="side" aria-label="Navigation">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 6 6 0 0 0-6-6 4 4 0 0 0-4 4 2 2 0 0 0 2 2"/></svg>eddy</div>
      <button class="switch" id="switchSide" data-act="clmenu" aria-haspopup="dialog" aria-label="Switch cluster"></button>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot" id="sidefoot"></div>
    </aside>
    <main class="content" id="content">
      <header class="top">
        <button class="switch" id="switchTop" data-act="clmenu" aria-haspopup="dialog" aria-label="Switch cluster"></button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <button class="search" data-act="search" aria-label="Search"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6l3.4 3.4"/></svg><span class="t">Search every cluster</span><kbd id="modk">⌘K</kbd></button>
        <button class="aibtn" data-act="ai" id="aibtn"></button>
      </header>
      <section class="page" id="page">
        <nav class="mcrumbs" id="mcrumbs" aria-label="Breadcrumb"></nav>
        <div id="strip"></div>
        <div class="cards" id="cards"></div>
        <div class="tools">
          <label class="filter"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg><input id="filter" type="text" placeholder="Filter this list" autocomplete="off" spellcheck="false" aria-label="Filter this list"><kbd>/</kbd></label>
          <div class="chips" id="chips" role="group" aria-label="Show"></div>
          <span class="cnt" id="cnt"></span>
        </div>
        <div class="table">
          <div class="thead" aria-hidden="true"><span>Name</span><span class="c-kind">Kind</span><span>Status</span><span>Message</span><span class="c-rev">Revision</span><span style="text-align:right">Age</span><span></span></div>
          <ul class="rows" id="rows"></ul>
        </div>
      </section>
      <section class="logs" id="logs" hidden aria-label="Logs"><div class="lgh" id="lgh"></div><div class="lgb" id="lgb"></div></section>
      <nav class="bnav" id="bnav" aria-label="Quick actions"></nav>
    </main>
    <aside class="detail" id="detail" aria-label="Details"></aside>
  </div>
</div></div>

<div class="scrim top" id="palette" hidden>
  <div class="dialog" role="dialog" aria-label="Command palette">
    <div class="pin"><svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6l3.4 3.4"/></svg><input id="pq" type="text" autocomplete="off" spellcheck="false" placeholder="Search every cluster, or type : for commands" aria-label="Search"></div>
    <div class="pres" id="pres" role="listbox"></div>
    <div class="pfoot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>:</kbd> commands only</span><span><kbd>?</kbd> then enter to ask AI</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>
<div class="scrim" id="clm" hidden><div class="dialog" role="dialog" aria-label="Clusters" id="clmbody"></div></div>
<div class="scrim" id="confirm" hidden><div class="dialog modal" role="dialog" aria-label="Confirm" id="confirmbody"></div></div>
<div class="scrim" id="help" hidden><div class="dialog" role="dialog" aria-label="Keyboard shortcuts" id="helpbody"></div></div>
<div class="scrim" id="sheet" hidden><div class="sheetbody" role="dialog" aria-label="Details" id="sheetbody"></div></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let seed=20260930;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const sha=()=>Array.from({length:7},()=>'0123456789abcdef'[Math.floor(rnd()*16)]).join('');
const sfx=n=>Array.from({length:n},()=>'bcdfghjklmnpqrstvwxz2456789'[Math.floor(rnd()*27)]).join('');
const ageOf=()=>pick(['41m','3h','7h','19h','2d','4d','11d','23d']);
const isNarrow=()=>matchMedia('(max-width: 859px)').matches;
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
const sv=(p,cls='i')=>`<svg class="${cls}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  ready:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.9 8.2l2.1 2.1 4.2-4.5" fill="none" stroke="var(--win)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  failed:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" fill="none" stroke="var(--win)" stroke-width="1.8" stroke-linecap="round"/></svg>',
  progressing:'<svg class="i spin" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2.2"/><path d="M8 2a6 6 0 0 1 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  suspended:sv('<circle cx="8" cy="8" r="6.3"/><path d="M6.4 5.7v4.6M9.6 5.7v4.6"/>'),
  chev:sv('<path d="M6 3.5L10.5 8 6 12.5"/>'),
  sep:sv('<path d="M6 3.5L10.5 8 6 12.5"/>','i sep'),
  updown:sv('<path d="M5 6l3-3 3 3M5 10l3 3 3-3"/>'),
  lock:sv('<rect x="3.5" y="7" width="9" height="6.5" rx="1.6"/><path d="M5.5 7V5.3a2.5 2.5 0 0 1 5 0V7"/>'),
  info:sv('<circle cx="8" cy="8" r="6.3"/><path d="M8 7.3v3.7M8 5v.1"/>'),

}

function reconcile(n=detailNode(),withSource=false){
  if(!n||n.kind==='Cluster')return;
  if(!FLUX.has(n.kind)){toast(`${n.kind}s aren't synced by Flux directly. Press t to jump to the Flux object that owns it.`);return}
  if(n.status==='suspended'){toast(`${n.name} is suspended. Resume it first with s.`);return}

  const prev=n.status,pm=n.msg;n._busy=true;n.status='progressing';n.msg=src?`Waiting for ${src.kind}/${src.name} to fetch`:'Reconciliation in progress';
  events(n).unshift(ev('Normal','ReconcileRequested',`Sync${src?' with source':''} requested by ${USER.email}`,'now'));
  if(src&&!src._busy){src._busy=true;src._prev=src.status;src.status='progressing';src.msg='Fetching latest revision';setTimeout(()=>{src._busy=false;src.status='ready';src.msg=okMsg(src);events(src).unshift(ev('Normal','NewArtifact',src.msg,'now'));render()},700)}
  render();

    if(prev==='failed'){n.status='failed';n.msg=pm;events(n).unshift(ev('Warning',n.failReason||'ReconciliationFailed',pm,'now'));toast(`${n.name} is still failing: ${pm}`,'bad')}
    else{n.status='ready';n.msg=okMsg(n);events(n).unshift(ev('Normal','ReconciliationSucceeded',n.msg,'now'));
      let fixed=0;for(const d of descendants(n))if(d.status==='progressing'&&!d._busy){d.status='ready';fixed++;if(d.replicas){d.readyN=d.replicas;d.msg=okMsg(d)}else{d.msg='Running';d.phase='Running';d.creating=false;d.events=null}}

    render()},src?1900:1400);
}

function logLinesFor(n,count=60){
  const now=Date.now();
  if(n.pullFail)return [{t:new Date(now-360000),l:'warn',m:`Container "${n.container}" hasn't started, so there are no logs yet. Showing why:`},...events(n).slice().reverse().map((e,i)=>({t:new Date(now-300000+i*60000),l:e.type==='Warning'?'error':'info',m:`${e.reason}: ${e.msg}`}))];
  if(n.status==='progressing'&&n.creating)return [{t:new Date(now-2000),l:'info',m:`Waiting for container "${n.container}" to start (ContainerCreating). Logs will appear once it runs.`}];
  const out=[];for(let i=count;i>0;i--)out.push(genLine(n,new Date(now-i*1400-ri(0,900))));return out;
}
function lineHTML(x){return `<div class="lg ${x.l}"><span class="meta"><span class="t">${fmtT(x.t)}</span><span class="l">${x.l.toUpperCase()}</span></span><span class="m">${esc(x.m)}</span></div>`}

const RULES=`You are the assistant inside Eddy, a web UI for FluxCD on Kubernetes. Answer the operator's question quickly and precisely.
Rules:
- Use only the data given here and what the tools return. If something isn't available, say so. Never invent versions, revisions or events.
- Look things up with the tools when the given context isn't enough (owners, children, sources, logs, other clusters).
- Lead with the direct answer in one sentence, then at most 4 short bullets of evidence or next steps. Stay under 130 words.
- Name exact versions, revisions and resource names. Put names, versions and commands in \`backticks\`.
- When a fix involves Flux, suggest the flux CLI command (for example \`flux reconcile helmrelease podinfo -n apps --with-source\`) or the Git change to make. In Eddy, r syncs, R syncs with source, s suspends or resumes.
- Plain text with simple markdown only: bullets and backticks, no headings, no tables.`;
async function ask(q){
  q=String(q||'').trim();if(!q||AI.busy)return;
  S.pane='ai';
  const n=aiCtxNode(),key=n?n.id:`cluster:${S.cluster}`;
  if(AI.key!==key){AI.key=key;AI.turns=[];AI.msgs=[]}
  const content=(AI.turns.length?'':RULES+'\n\n')+aiContext()+'\nQuestion: '+q;
  AI.turns.push({role:'user',content});AI.msgs.push({role:'user',text:q});
  const m={role:'assistant',text:'',steps:[],err:'',cut:false};AI.msgs.push(m);
  AI.busy=true;AI.draft='';renderPane();
  const sample=AI.sample===undefined?await samplePromise:AI.sample;
  if(!sample){m.err='Ask AI works when this page is opened in Claude. It isn’t available in this view.';AI.busy=false;AI.turns.pop();renderPane();return}
  AI.ctl=new AbortController();
  try{
    const r=await sample(AI.turns,{modelTier:'quick',cache:false,signal:AI.ctl.signal,tools:aiTools,onText:({text})=>{m.text=text;renderAIMsgs()}});
    m.text=r.text;m.cut=!!r.truncated;AI.turns.push({role:'assistant',content:r.text});
  }catch(e){
    m.text=e&&e.text?e.text:m.text;AI.turns.pop();
    const code=e&&e.code;
    m.err=code==='cancelled'?'Stopped.':code==='not_granted'?'AI access was declined for this page. Reload the page to be asked again.':code==='rate_limited'||code==='queue_overflow'?'Too many questions at once. Wait a moment, then ask again.':code==='session_expired'?'Your Claude session expired. Reload the page.':code==='sampling_disabled'||code==='capability_disabled'?'AI answers are turned off for your account or organization.':code==='prompt_too_large'?'That question pulled in too much data. Ask about a single resource.':`Couldn't get an answer (${code||'error'}). Try again.`;
  }finally{AI.busy=false;AI.ctl=null;renderPane()}
}
function md(t){
  const blocks=[];t=String(t).replace(/```[\w-]*\n?([\s\S]*?)(```|$)/g,(m,c)=>{blocks.push(c.replace(/\n$/,''));return `\u0000${blocks.length-1}\u0000`});
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  const out=[];let list=null;
  for(const raw of t.split('\n')){const line=raw.trimEnd();
    const b=line.match(/^\u0000(\d+)\u0000$/);if(b){if(list){out.push(`</${list}>`);list=null}out.push(`<pre><code>${esc(blocks[+b[1]])}</code></pre>`);continue}
    const li=line.match(/^\s*(?:[-*•]|(\d+)[.)])\s+(.*)$/);
    if(li){const t2=li[1]?'ol':'ul';if(list!==t2){if(list)out.push(`</${list}>`);out.push(`<${t2}>`);list=t2}out.push(`<li>${inline(li[2])}</li>`);continue}
    if(list){out.push(`</${list}>`);list=null}
    if(line.trim())out.push(`<p>${inline(line.replace(/^#+\s*/,''))}</p>`);
  }
  if(list)out.push(`</${list}>`);return out.join('');
}

/* ---------- help ---------- */
function hk([l,ks]){return `<div class="hk"><span>${l}</span><span>${ks.map(k=>`<kbd>${k}</kbd>`).join('')}</span></div>`}
$('#helpbody').innerHTML=`<div class="modal" style="padding-bottom:4px"><h3>Keyboard shortcuts</h3><p>Everything works without a mouse. Press <kbd>?</kbd> or <kbd>esc</kbd> to close.</p></div><div class="hgrid">
<h4>Move around</h4>${[['Move down / up',['j','k']],['Open selected',['l']],['Go back up',['h']],['Top / bottom',['g g','G']],['Needs attention',['g f']],['Jump to owner',['t']]].map(hk).join('')}
<h4>Find and ask</h4>${[['Search every cluster',[isMac?'⌘ K':'Ctrl K']],['Commands only',[':']],['Filter this list',['/']],['Ask AI about selection',['a']]].map(hk).join('')}
<h4>Clusters</h4>${[['prod-eu / staging / dev',['1','2','3']],['Previous / next cluster',['[',']']]].map(hk).join('')}
<h4>Act on selection</h4>${[['Sync',['r']],['Sync with source',['R']],['Suspend or resume',['s']],['Logs (pods)',['L']],['Overview / events / YAML',['o','e','y']]].map(hk).join('')}
<h4>In logs</h4>${[['Toggle follow',['f']],['Scroll',['j','k']],['Back to list',['h']]].map(hk).join('')}</div>`;

/* ---------- input ---------- */
const filterEl=$('#filter');
filterEl.addEventListener('input',()=>{cs().filter=filterEl.value;cs().sel=null;renderHead();renderRows();renderPane()});
let gPending=0;
document.addEventListener('keydown',e=>{
  const k=e.key;
  if((e.metaKey||e.ctrlKey)&&k.toLowerCase()==='k'){e.preventDefault();S.palette?closePalette():openPalette();return}
  if(S.palette){const P_=S.palette;
    if(k==='Escape'){e.preventDefault();closePalette()}
    else if(k==='ArrowDown'||(e.ctrlKey&&(k==='n'||k==='j'))){e.preventDefault();P_.i=Math.min(P_.flat.length-1,P_.i+1);renderPalette()}
    else if(k==='ArrowUp'||(e.ctrlKey&&(k==='p'||k==='k'))){e.preventDefault();P_.i=Math.max(0,P_.i-1);renderPalette()}
    else if(k==='Enter'){e.preventDefault();runPalette(P_.i)}
    return}
  if(S.confirm){if(k==='Escape')closeConfirm();return}
  if(S.help){if(k==='Escape'||k==='?'){S.help=false;renderOverlays()}return}
  if(S.clm&&k==='Escape'){S.clm=false;renderOverlays();return}
  const tgt=e.target;
  if(tgt===filterEl){if(k==='Escape'){filterEl.value='';cs().filter='';filterEl.blur();render()}else if(k==='Enter'||k==='ArrowDown'){e.preventDefault();filterEl.blur()}return}
  if(tgt.matches&&tgt.matches('input,textarea,select'))return;
  if(S.sheet&&k==='Escape'){S.sheet=false;renderOverlays();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const g=Date.now()-gPending<600;gPending=0;
  if(k==='a'){e.preventDefault();openAI();return}
  if(S.logs){const b=$('#lgb');
    if(k==='f')setFollow(!S.logs.follow);
    else if(k==='h'||k==='Escape'||k==='Backspace'||k==='ArrowLeft'){e.preventDefault();closeLogs()}
    else if(k==='j'||k==='ArrowDown')b.scrollTop+=60;
    else if(k==='k'||k==='ArrowUp'){b.scrollTop-=60;setFollow(false)}
    else if(k==='G')setFollow(true);
    else if(k==='g'){if(g){b.scrollTop=0;setFollow(false)}else gPending=Date.now()}
    else if(k==='?'){S.help=true;renderOverlays()}
    else if(CL.some(c=>c.key===k))switchCluster(CL.find(c=>c.key===k).id);
    return}
  const L=list();
  switch(k){
    case 'j':case 'ArrowDown':e.preventDefault();move(1);break;
    case 'k':case 'ArrowUp':e.preventDefault();move(-1);break;
    case 'l':case 'Enter':case 'ArrowRight':if(k==='Enter'&&tgt.closest&&tgt.closest('button')&&!tgt.classList.contains('row-main'))return;e.preventDefault();drill();break;
    case 'h':case 'Backspace':case 'ArrowLeft':e.preventDefault();up();break;
    case 'G':if(L.length){cs().sel=L[L.length-1].id;renderRows();renderPane()}break;
    case 'g':if(g){if(L.length){cs().sel=L[0].id;renderRows();renderPane()}}else gPending=Date.now();break;
    case 'f':if(g){const bad=L.find(n=>n.status!=='ready');if(bad){cs().sel=bad.id;renderRows();renderPane()}else setKind('failing')}break;
    case '/':e.preventDefault();filterEl.focus();break;
    case ':':e.preventDefault();openPalette(':');break;
    case 'r':reconcile();break;
    case 'R':reconcile(undefined,true);break;
    case 's':suspend();break;
    case 'L':{const n=selNode();if(n&&n.kind==='Pod')openLogs(n);else toast('Logs are available on pods. Open a workload to see its pods.');break}
    case 't':trace();break;
    case 'o':case 'e':case 'y':cs().tab={o:'overview',e:'events',y:'yaml'}[k];S.pane='details';renderPane();break;
    case '?':S.help=true;renderOverlays();break;
    case '[':case ']':{const i=CL.findIndex(c=>c.id===S.cluster);switchCluster(CL[(i+(k===']'?1:CL.length-1))%CL.length].id);break}
    case 'Escape':{const s=cs();if(S.pane==='ai'){S.pane='details';renderPane();renderSide()}else if(s.filter||s.kind){s.filter='';s.kind=null;render()}break}
    default:{const c=CL.find(c=>c.key===k);if(c)switchCluster(c.id)}
  }
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,s=cs();
  switch(a){
    case 'row':if(isNarrow()){s.sel=id;const n=N[id];if(n.kind==='Pod'||n.children.length)drill(n);else{S.sheet=true;S.pane='details';render()}}else if(s.sel===id)drill(N[id]);else{s.sel=id;renderRows();if(S.pane==='details')renderPane();else renderPane()}break;
    case 'info':s.sel=id;S.sheet=true;S.pane='details';render();break;
    case 'crumb':{const i=+t.dataset.i;s.sel=s.path[i]||null;s.path=s.path.slice(0,i);s.filter='';render();break}
    case 'cluster':switchCluster(t.dataset.c);break;
    case 'clmenu':S.clm=!S.clm;renderOverlays();break;
    case 'search':openPalette();break;
    case 'role':if(t.dataset.r!==S.role)toggleRole(t.dataset.r);break;
    case 'nav':setKind(t.dataset.k);break;
    case 'reveal':reveal(id);break;
    case 'tab':s.tab=t.dataset.t;renderPane();break;
    case 'pane':S.pane=t.dataset.p;renderPane();renderSide();if(S.pane==='ai')focusAI();break;
    case 'ai':if(isNarrow()){if(S.sheet&&S.pane==='ai'){S.sheet=false;renderOverlays();renderBnav()}else openAI()}else{S.pane=S.pane==='ai'?'details':'ai';renderPane();renderSide();if(S.pane==='ai')focusAI()}break;
    case 'ask':if(t.dataset.ctx==='cluster')AI.ctx='cluster';if(isNarrow())S.sheet=true;S.pane='ai';render();ask(t.dataset.q);break;
    case 'aictx':AI.ctx=t.dataset.v;renderPane();break;
    case 'ainew':AI.msgs=[];AI.turns=[];AI.key=null;renderPane();focusAI();break;
    case 'aisend':{const ta=t.closest('.comp').querySelector('[data-aiinput]');ask(ta.value);break}
    case 'aistop':AI.ctl?.abort();break;
    case 'reconcile':reconcile();break;
    case 'syncsrc':reconcile(id?N[id]:undefined,!id);break;
    case 'suspend':suspend();break;
    case 'open':drill();break;
    case 'logs':{const n=detailNode();if(n.kind==='Pod')openLogs(n);break}
    case 'trace':trace();break;
    case 'back':up();break;
    case 'help':S.help=true;renderOverlays();break;
    case 'closelogs':closeLogs();break;
    case 'follow':setFollow(!S.logs.follow);break;
    case 'theme':toggleTheme();break;
    case 'cancel':closeConfirm();break;
    case 'doconfirm':confirmOk();break;
  }
});
document.addEventListener('dblclick',e=>{const t=e.target.closest('[data-act="row"]');if(t&&!isNarrow())drill(N[t.dataset.id])});
['palette','clm','confirm','help','sheet'].forEach(x=>$('#'+x).addEventListener('click',e=>{if(e.target.id!==x)return;if(x==='palette')closePalette();else if(x==='confirm')closeConfirm();else{S[x]=false;renderOverlays();renderBnav()}}));
matchMedia('(max-width: 859px)').addEventListener('change',()=>{S.sheet=false;render()});
render();
</script>
</body>
</html>
