# git-cliff configuration: https://git-cliff.org/docs/configuration
# Changelog is generated from Conventional Commits. The commit body (the "why") is kept.
# Normally driven by the hub Taskfile (`task changelog:preview`, `task release`).

[changelog]
header = """
# Changelog

All notable changes to Eddy. Generated by [git-cliff](https://git-cliff.org) from Conventional Commits.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}\n
"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^build", group = "<!-- 6 -->Build and dev environment" },
  { message = "^ci", group = "<!-- 7 -->CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", group = "<!-- 8 -->Dependencies" },
  { message = "^chore", group = "<!-- 9 -->Chores" },
  { message = "^style", group = "<!-- 9 -->Chores" },
  { message = "^revert", group = "<!-- 10 -->Reverts" },
]

[bump]
# The first release, when no v* tag exists yet.
initial_tag = "v1.0.0"
