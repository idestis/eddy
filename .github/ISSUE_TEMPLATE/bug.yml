name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Eddy version}
    validations: {required: true}
  - type: input
    id: flux
    attributes: {label: Flux and Kubernetes versions}
  - type: textarea
    id: what
    attributes: {label: What happened, and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
