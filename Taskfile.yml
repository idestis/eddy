version: "3"

# A gitignored .env can hold local-mode settings (see .env.example). Variables already in
# the environment, and task variables on the command line, win over it.
dotenv: [".env"]

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X github.com/idestis/eddy/internal/version.Version={{.VERSION}}
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.1

tasks:
  default:
    cmds: [task --list]

  check:
    desc: Lint, test and build everything (run before opening a PR)
    cmds:
      - task: lint
      - task: test
      - task: ui
      - task: build

  build:
    desc: Build hub and agent binaries into bin/
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags '{{.LDFLAGS}}' -o bin/eddy-hub ./cmd/hub
      - CGO_ENABLED=0 go build -trimpath -ldflags '{{.LDFLAGS}}' -o bin/eddy-agent ./cmd/agent

  test:
    desc: Go tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  lint:
    desc: gofmt, go vet, staticcheck and Biome
    cmds:
      - test -z "$(gofmt -l cmd internal api)" || (gofmt -l cmd internal api && exit 1)
      - go vet ./...
      - go run {{.STATICCHECK}} ./...
      - task: ui:lint

  ui:install:
    dir: web
    sources: [package.json, pnpm-lock.yaml]
    cmds: [pnpm install --frozen-lockfile]

  ui:
    desc: Build the SPA into internal/ui/dist (embedded by the hub)
    deps: [ui:install]
    dir: web
    cmds: [pnpm run build]

  ui:lint:
    deps: [ui:install]
    dir: web
    cmds: [pnpm run lint, pnpm run typecheck, pnpm run test]

  ui:dev:
    desc: Vite dev server on :5173, proxying /api, /auth and /mcp to :8080
    deps: [ui:install]
    dir: web
    cmds: [pnpm run dev]

  # Local mode (docs/development.md). Task variables: CONTEXTS=ctx1,ctx2[=name] (default: the
  # current context), ALLOW_WRITES=1, ALLOW_WRITES_PROTECTED=1, PROTECT=<regex> (default
  # (?i)prod), PG=1 (the postgres store from dev:pg instead of memory), and LOCAL=0 for the
  # real impersonating agent (kind). They override EDDY_AGENT_* from the environment or .env.
  dev:
    desc: "Local mode: hub, agent (your kube contexts, read-only) and web with hot reload. CONTEXTS=a,b"
    env: &dev-env
      CONTEXTS: '{{.CONTEXTS | default ""}}'
      LOCAL: '{{.LOCAL | default ""}}'
      ALLOW_WRITES: '{{.ALLOW_WRITES | default ""}}'
      ALLOW_WRITES_PROTECTED: '{{.ALLOW_WRITES_PROTECTED | default ""}}'
      PROTECT: '{{.PROTECT | default ""}}'
      PG: '{{.PG | default ""}}'
    deps: [ui:install]
    cmds: [hack/dev.sh all]

  dev:config:
    desc: Write .dev/hub.yaml and .dev/agent-token for local mode (CONTEXTS=, PROTECT=, PG=1)
    env: *dev-env
    cmds: [hack/dev.sh config]

  dev:pg:
    desc: Start a throwaway postgres:17 on 127.0.0.1:55432 (named volume eddy-dev-pg) and print the DSN
    cmds: [hack/dev.sh pg]

  dev:pg:down:
    desc: Stop the dev:pg container (the volume keeps the data)
    cmds: [hack/dev.sh pg-down]

  dev:hub:
    desc: Run the hub with hot reload (air, -tags dev), the generated .dev/hub.yaml and fake login
    env: *dev-env
    cmds:
      - hack/dev.sh config
      - hack/dev.sh hub

  dev:agent:
    desc: Run the agent with hot reload in local mode (CONTEXTS=, ALLOW_WRITES=1); LOCAL=0 runs the impersonating agent (kind)
    env: *dev-env
    cmds:
      - hack/dev.sh config
      - hack/dev.sh agent

  dev:web:
    desc: Vite on :5173, proxying /api, /auth and /mcp to the hub on :8080
    deps: [ui:install]
    cmds: [hack/dev.sh web]

  dev:mock:
    desc: Vite on :5173 with mock data (VITE_MOCK=1); no hub or agent needed
    deps: [ui:install]
    dir: web
    env:
      VITE_MOCK: "1"
    cmds: [pnpm run dev]

  images:
    desc: Build the hub and agent container images
    cmds:
      - docker build --target hub -t ghcr.io/idestis/eddy-hub:{{.VERSION}} .
      - docker build --target agent -t ghcr.io/idestis/eddy-agent:{{.VERSION}} .

  charts:
    desc: Lint and template the Helm charts
    cmds:
      - helm lint deploy/charts/eddy-hub deploy/charts/eddy-agent
      - helm template eddy deploy/charts/eddy-hub --set store.postgres.dsnSecret.name=eddy-db > /dev/null
      - helm template eddy deploy/charts/eddy-hub --set store.driver=memory > /dev/null
      - helm template eddy deploy/charts/eddy-agent --set cluster.name=test --set hub.url=wss://hub.example.com/agent/v1/connect --set token.value=x > /dev/null

  kind:up:
    desc: Create a kind cluster with Flux, the hub and an agent
    cmds: [./deploy/kind/up.sh]

  kind:down:
    cmds: [kind delete cluster --name eddy]
