# Example RBAC for Eddy users. Apply in EVERY workload cluster (kubectl apply -f).
#
# Eddy never invents permissions: the agent impersonates the signed-in user and the API server
# decides. Users and groups arrive as:
#   user   local:<username>  (local auth) or <userPrefix><header value> (proxy auth)
#   groups eddy:<group>      (prefix from auth.groups.prefix), plus eddy:authenticated for all
#
# Edit the subjects to match your groups. Bind to a namespace-scoped RoleBinding instead of the
# ClusterRoleBinding below to limit a team to some namespaces.
#
# Adding a kind to Eddy means extending both ClusterRoles.
#
# YAML and events of any object (watched kinds and objects known only from a Kustomization
# inventory) are read as the user, so they need `get` on that kind (and `list` on events).
# Eddy never shows Secret YAML, and strips data/binaryData from ConfigMaps; granting `get` on
# configmaps still lets the user read their data with kubectl, so it is not granted here.
#
# The Karpenter and External Secrets rules only matter when the agent chart enables the
# matching watch.presets; they are harmless where those CRDs are not installed.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eddy-viewer
  labels:
    app.kubernetes.io/part-of: eddy
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts, buckets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events, namespaces, services, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  # watch.presets: karpenter
  - apiGroups: [karpenter.sh]
    resources: [nodepools, nodeclaims]
    verbs: [get, list, watch]
  - apiGroups: [karpenter.k8s.aws]
    resources: [ec2nodeclasses]
    verbs: [get, list, watch]
  # watch.presets: externalSecrets
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, clusterexternalsecrets, secretstores, clustersecretstores, pushsecrets]
    verbs: [get, list, watch]
  # Logs are only readable in the UI when this is granted (and over MCP when mcp.allowLogs is on).
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eddy-operator
  labels:
    app.kubernetes.io/part-of: eddy
rules:
  # Everything a viewer can do...
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch, patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch, patch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts, buckets]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events, namespaces, services, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  # watch.presets: karpenter
  - apiGroups: [karpenter.sh]
    resources: [nodepools, nodeclaims]
    verbs: [get, list, watch]
  - apiGroups: [karpenter.k8s.aws]
    resources: [ec2nodeclasses]
    verbs: [get, list, watch]
  # watch.presets: externalSecrets
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, clusterexternalsecrets, secretstores, clustersecretstores, pushsecrets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # ...plus patch on the Flux kinds: reconcile (requestedAt annotation), suspend and resume.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eddy-viewer
  labels:
    app.kubernetes.io/part-of: eddy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eddy-viewer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: eddy:authenticated
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eddy-operator
  labels:
    app.kubernetes.io/part-of: eddy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eddy-operator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: eddy:platform
