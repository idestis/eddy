apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eddy-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddy-agent.labels" . | nindent 4 }}
spec:
  # Each replica connects to the hub as its own agent instance; the hub uses one and keeps
  # the others as standbys.
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "eddy-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eddy-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "eddy-agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: {{ include "eddy-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: EDDY_CLUSTER
              value: {{ .Values.cluster.name | quote }}
            - name: EDDY_HUB_URL
              value: {{ .Values.hub.url | quote }}
            - name: EDDY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "eddy-agent.tokenSecretName" . }}
                  key: {{ .Values.token.key }}
                  {{- if .Values.joinToken }}
                  optional: true
                  {{- end }}
            {{- if .Values.joinToken }}
            - name: EDDY_JOIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "eddy-agent.tokenSecretName" . }}
                  key: joinToken
                  optional: true
            - name: EDDY_TOKEN_SECRET
              value: {{ include "eddy-agent.tokenSecretName" . | quote }}
            - name: EDDY_TOKEN_SECRET_KEY
              value: {{ .Values.token.key | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            {{- end }}
            {{- if .Values.hub.caBundle }}
            - name: EDDY_HUB_CA_FILE
              value: /etc/eddy/hub-ca/ca.crt
            {{- end }}
            {{- if .Values.watch.namespaces }}
            - name: EDDY_WATCH_NAMESPACES
              value: {{ join "," .Values.watch.namespaces | quote }}
            {{- end }}
            - name: EDDY_ALLOWED_GROUP_PREFIXES
              value: {{ join "," .Values.impersonation.allowedGroupPrefixes | quote }}
            {{- if .Values.impersonation.groups }}
            - name: EDDY_ALLOWED_GROUPS
              value: {{ join "," .Values.impersonation.groups | quote }}
            {{- end }}
            - name: EDDY_DENY_USER_PREFIXES
              value: {{ join "," .Values.impersonation.denyUserPrefixes | quote }}
            {{- if .Values.hub.allowInsecure }}
            - name: EDDY_ALLOW_INSECURE
              value: "1"
            {{- end }}
            - name: EDDY_HEALTH_ADDR
              value: {{ printf ":%d" (int .Values.healthPort) | quote }}
            {{- $n := max 1 (int .Values.replicaCount) }}
            # limits.* divided by replicaCount ({{ $n }}).
            - name: EDDY_KUBE_QPS
              value: {{ max 1 (div (int .Values.limits.qps) $n) | quote }}
            - name: EDDY_KUBE_BURST
              value: {{ max 1 (div (int .Values.limits.burst) $n) | quote }}
            - name: EDDY_MAX_CONCURRENT
              value: {{ max 1 (div (int .Values.limits.concurrency) $n) | quote }}
            - name: EDDY_MAX_LOG_STREAMS
              value: {{ max 1 (div (int .Values.limits.logStreams) $n) | quote }}
            - name: EDDY_MAX_SAR_CONCURRENT
              value: {{ max 1 (div (int .Values.limits.sarConcurrency) $n) | quote }}
            - name: EDDY_MAX_LOG_PODS
              value: {{ .Values.workloadLogs.maxPods | int | quote }}
            - name: EDDY_LOG_LINE_RATE
              value: {{ .Values.workloadLogs.lineRate | int | quote }}
            - name: EDDY_JOB_HISTORY
              value: {{ .Values.jobs.history | int | quote }}
            - name: EDDY_JOB_FAILED_MAX_AGE
              value: {{ .Values.jobs.failedMaxAge | quote }}
            - name: EDDY_JOB_BUILDUP_THRESHOLD
              value: {{ .Values.jobs.buildupThreshold | int | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: health, containerPort: {{ .Values.healthPort }}}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.hub.caBundle }}
            - {name: hub-ca, mountPath: /etc/eddy/hub-ca, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        {{- if .Values.hub.caBundle }}
        - name: hub-ca
          configMap: {name: {{ include "eddy-agent.fullname" . }}-hub-ca}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "eddy-agent.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
