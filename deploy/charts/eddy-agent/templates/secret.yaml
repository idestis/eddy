{{- if and .Values.token.value (not .Values.token.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eddy-agent.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddy-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.token.key }}: {{ .Values.token.value | quote }}
{{- end }}
{{- if and .Values.joinToken (not .Values.token.existingSecret) }}
{{- $name := include "eddy-agent.tokenSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddy-agent.labels" . | nindent 4 }}
  annotations:
    # The agent writes its permanent token here; keep it when the release is removed.
    helm.sh/resource-policy: keep
type: Opaque
data:
  joinToken: {{ .Values.joinToken | b64enc }}
  {{- with $existing }}{{ with index .data $.Values.token.key }}
  {{ $.Values.token.key }}: {{ . }}
  {{- end }}{{ end }}
{{- end }}
{{- if .Values.hub.caBundle }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eddy-agent.fullname" . }}-hub-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddy-agent.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- .Values.hub.caBundle | nindent 4 }}
{{- end }}
