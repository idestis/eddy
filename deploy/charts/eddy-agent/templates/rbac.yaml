{{- if .Values.rbac.create }}
# Read-only cache access plus the two things Eddy needs to act as the signed-in user:
# SubjectAccessReviews and impersonation. No write verbs on any resource, and no access to
# Secrets or ConfigMaps. Adding a kind means extending the read rules below (preset kinds go in
# the watch.presets blocks).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "eddy-agent.fullname" . }}
  labels:
    {{- include "eddy-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts, buckets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events, namespaces, services, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  {{- if has "karpenter" .Values.watch.presets }}
  # watch.presets: karpenter
  - apiGroups: [karpenter.sh]
    resources: [nodepools, nodeclaims]
    verbs: [get, list, watch]
  - apiGroups: [karpenter.k8s.aws]
    resources: [ec2nodeclasses]
    verbs: [get, list, watch]
  {{- end }}
  {{- if has "externalSecrets" .Values.watch.presets }}
  # watch.presets: externalSecrets. The agent never reads the Secrets these produce.
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, clusterexternalsecrets, secretstores, clustersecretstores, pushsecrets]
    verbs: [get, list, watch]
  {{- end }}
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [users]
    verbs: [impersonate]
  - apiGroups: [""]
    resources: [groups]
    verbs: [impersonate]
    {{- with .Values.impersonation.groups }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "eddy-agent.fullname" . }}
  labels:
    {{- include "eddy-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "eddy-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "eddy-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.rbac.create .Values.joinToken (not .Values.token.existingSecret) }}
---
# The agent's only write permission (ADR-0005): get and update its own token Secret, where it
# stores the permanent token it receives when it joins. resourceNames pins it to that Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "eddy-agent.fullname" . }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddy-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "eddy-agent.tokenSecretName" . }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "eddy-agent.fullname" . }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddy-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "eddy-agent.fullname" . }}-token
subjects:
  - kind: ServiceAccount
    name: {{ include "eddy-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
