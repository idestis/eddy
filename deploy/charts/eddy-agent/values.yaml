# Eddy agent chart values. Install one agent per workload cluster; the eddy-hub chart's
# NOTES.txt prints the exact command.

cluster:
  name: ""            # required. Must match the Cluster CR name in the hub.

hub:
  # The hub's agent endpoint, e.g. wss://eddy-agents.internal.example.com/agent/v1/connect
  url: ""             # required. Must be wss://.
  # PEM CA bundle, only if the hub certificate is not publicly trusted.
  caBundle: ""
  # ws:// instead of wss://. Local development only (the kind quickstart uses TLS and does
  # not need this).
  allowInsecure: false

token:
  existingSecret: ""  # Secret holding the agent token (preferred)
  key: token
  value: ""           # or pass the token inline; the chart stores it in a Secret

# One-time join token from the hub's "Add cluster" wizard (eddy_join_…, ADR-0005). The
# chart stores it in the token Secret (<fullname>-token, kept on uninstall). On its first
# connection the agent trades it for a permanent token, which it writes to the same Secret
# under token.key: a Role lets it get and update that one Secret and nothing else. Leave
# empty when you use token.existingSecret or token.value.
joinToken: ""

watch:
  namespaces: []      # empty = whole cluster. Sets EDDY_WATCH_NAMESPACES.
  # Opt-in groups of extra kinds to watch (EDDY_WATCH_PRESETS). Each preset adds its kinds to
  # the agent's cache (only those the cluster serves) and get/list/watch on them to the
  # ClusterRole. Supported:
  #   karpenter        karpenter.sh NodePool, NodeClaim; karpenter.k8s.aws EC2NodeClass
  #   externalSecrets  external-secrets.io ExternalSecret, ClusterExternalSecret, SecretStore,
  #                    ClusterSecretStore, PushSecret (never the Secrets they produce)
  presets: []         # e.g. [karpenter, externalSecrets]

impersonation:
  # Groups the agent may impersonate must start with one of these. `system:` is always refused.
  allowedGroupPrefixes: ["eddy:"]
  # Optional exact allowlist. When set, the impersonate verb on groups is pinned to these
  # names (RBAC resourceNames) and EDDY_ALLOWED_GROUPS is set: the strictest option.
  # Remember eddy:authenticated, which every signed-in user carries.
  groups: []
  # e.g. ["eddy:authenticated", "eddy:platform", "eddy:oncall"]
  # Users the agent refuses to impersonate, checked again after the hub's own check.
  denyUserPrefixes: ["system:", "eks:", "kubernetes-admin"]

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/idestis/eddy-agent
  tag: ""             # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Agent replicas (ADR-0004). Every replica watches the cluster and connects to the hub; the
# hub serves the cluster from the oldest one and keeps the others as hot standbys, so losing
# a pod or node does not disconnect the cluster. The cost is one set of watches per replica.
replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate: {maxSurge: 1, maxUnavailable: 0}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Control-plane protection, for the agent Deployment as a whole: the chart divides every value
# by replicaCount (rounding down, at least 1) before passing it to each pod, so the API server
# sees the same total load whatever the replica count.
limits:
  qps: 20             # client-go QPS (EDDY_KUBE_QPS), for the agent's own clients and, separately, all impersonated ones
  burst: 40           # client-go burst (EDDY_KUBE_BURST)
  concurrency: 16     # user requests in flight (EDDY_MAX_CONCURRENT); hub replicas prefer the agent connected to them, so every agent replica may serve
  logStreams: 8       # log streams in flight (EDDY_MAX_LOG_STREAMS)
  sarConcurrency: 8   # SubjectAccessReviews in flight (EDDY_MAX_SAR_CONCURRENT)

# Workload log streams (the Logs tab of a Deployment, StatefulSet, DaemonSet or Job). Each
# stream is one of limits.logStreams and follows up to maxPods pods (newest first), every pod ×
# container being its own API server log stream; lines beyond lineRate per second are dropped
# with a marker. Per stream, so not divided by replicaCount.
workloadLogs:
  maxPods: 20         # EDDY_MAX_LOG_PODS
  lineRate: 2000      # EDDY_LOG_LINE_RATE, lines per second per stream

# Finished Jobs. The agent watches every Job but lists only active ones, failed ones that
# finished within failedMaxAge and the newest `history` finished Jobs of each group (owner,
# well-known labels such as prefect.io/deployment-name, generateName or name prefix). The rest
# are hidden (the UI fetches them on demand) and reported as a job-buildup finding per
# namespace, a warning once more than buildupThreshold are hidden.
jobs:
  history: 5              # EDDY_JOB_HISTORY
  failedMaxAge: 24h       # EDDY_JOB_FAILED_MAX_AGE, a Go duration
  buildupThreshold: 100   # EDDY_JOB_BUILDUP_THRESHOLD

extraEnv: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities: {drop: [ALL]}
  seccompProfile: {type: RuntimeDefault}

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}

healthPort: 8081

nodeSelector: {}
tolerations: []
# Default: prefer replicas on different nodes (podAntiAffinity, preferred). Setting affinity
# replaces that default.
affinity: {}
priorityClassName: ""

# Egress-only policy, on by default: the agent needs DNS, the Kubernetes API and the hub, and
# accepts no inbound traffic. Kubelet health probes are allowed by most CNIs; set
# enabled: false if yours blocks them.
networkPolicy:
  enabled: true
  hubPorts: [443]
  hubTo: []           # e.g. [{ipBlock: {cidr: 10.20.0.0/16}}]. Empty allows any destination.
  kubeAPIPorts: [443, 6443]
  extraEgress: []
