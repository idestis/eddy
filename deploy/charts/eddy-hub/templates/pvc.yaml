{{- if and .Values.persistence.enabled (eq .Values.store.driver "sqlite") (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "eddy-hub.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddy-hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ if eq .Values.persistence.storageClass "-" }}""{{ else }}{{ .Values.persistence.storageClass | quote }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
