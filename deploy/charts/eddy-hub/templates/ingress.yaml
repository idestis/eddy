{{- range $name, $svc := dict "ui" (include "eddy-hub.fullname" .) "agents" (printf "%s-agents" (include "eddy-hub.fullname" .)) }}
{{- $ing := index $.Values.ingress $name }}
{{- if $ing.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "eddy-hub.fullname" $ }}{{ if eq $name "agents" }}-agents{{ end }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "eddy-hub.labels" $ | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $host := $ing.hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ $ing.path }}
            pathType: {{ $ing.pathType }}
            backend:
              service:
                name: {{ $svc }}
                port:
                  {{- if eq $name "agents" }}
                  number: {{ $.Values.service.agents.httpPort }}
                  {{- else }}
                  number: {{ $.Values.service.ui.port }}
                  {{- end }}
    {{- end }}
{{- end }}
{{- end }}
