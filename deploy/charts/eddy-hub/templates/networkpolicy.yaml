{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $ui := ternary "4180" (include "eddy-hub.port" .Values.config.listen.ui) .Values.oauth2Proxy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eddy-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddy-hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "eddy-hub.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - {port: {{ $ui }}, protocol: TCP}
      {{- with $np.ui.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - {port: {{ include "eddy-hub.port" .Values.config.listen.agents }}, protocol: TCP}
      {{- with $np.agents.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - {port: {{ include "eddy-hub.port" .Values.config.listen.metrics }}, protocol: TCP}
      {{- with $np.metrics.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $np.egress.enabled }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 443, protocol: TCP}
        {{- range $np.egress.kubeAPIPorts }}
        {{- if ne (int .) 443 }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
        {{- end }}
    {{- with $np.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
