{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "eddy-hub.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "eddy-hub.labels" . | nindent 4 }}
rules:
  - apiGroups: [gitops.eddy.dev]
    resources: [clusters]
    verbs: [get, list, watch]
  - apiGroups: [gitops.eddy.dev]
    resources: [clusters/status]
    verbs: [patch]
  {{- if .Values.onboarding.enabled }}
  # Onboarding (ADR-0005): add, change and remove clusters from the UI. Each request is
  # checked first with a SubjectAccessReview as the signed-in user.
  - apiGroups: [gitops.eddy.dev]
    resources: [clusters]
    verbs: [create, update, patch, delete]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "eddy-hub.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "eddy-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "eddy-hub.fullname" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "eddy-hub.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Secrets (agent tokens) are readable in the hub's own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "eddy-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddy-hub.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  {{- if .Values.onboarding.enabled }}
  # Onboarding: token Secrets of clusters added in the UI, and the permanent agent token
  # minted when an agent joins. This namespace only.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "eddy-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddy-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "eddy-hub.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "eddy-hub.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
