{{- if not .Values.sessionKeySecret }}
{{- $name := include "eddy-hub.keySecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := randAlphaNum 64 | b64enc }}
{{- if $existing }}{{ $key = index $existing.data "key" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddy-hub.labels" . | nindent 4 }}
  annotations:
    # Losing this key invalidates every PAT, so keep it if the release is removed.
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ $key }}
{{- end }}
